name: Argos Availability Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Argos availability service
        run: |
          python - <<'PY'
          import requests

          url = "https://www.argos.co.uk/stores/api/orchestrator/v0/locator/availability"

          params = {
              "origin": "LS81LD",
              "maxResults": "10",
              "maxDistance": "50",
              "save": "pdp-ss:/",
              "ssm": "true"
          }

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          r = requests.get(url, params=params, headers=headers, timeout=15)

          print("Status:", r.status_code)
          print("Content-Type:", r.headers.get("content-type"))
          print("Length:", len(r.text))
          print("Response:")
          print(r.text[:2000])
          PY
