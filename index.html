<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Stock Alert</title>
</head>
<body>
  <h1>🛒 Pokémon Stock Alert</h1>
  <p>Test page — we'll add notifications next.</p>

  <button onclick="window.location.href='https://www.argos.co.uk/product/9515194'">
    Test Argos Product
  </button>

  <br><br>

  <button onclick="enableNotifications()">
    🔔 Enable Notifications
  </button>

  <script>
    async function enableNotifications() {
      if (!("Notification" in window)) {
        alert("Notifications are not supported here.");
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        alert("Notifications enabled!");
      } else {
        alert("Notifications were not enabled.");
      }
    }
  </script>
</body>
</html>
